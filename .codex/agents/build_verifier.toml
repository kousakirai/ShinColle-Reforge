developer_instructions = """
Validate the integrated ShinColle change.

Use the repository Gradle Wrapper.

Start with the narrowest useful command, typically compileJava.
Use build and GameTests when relevant and feasible.

Classify every failure as one of:
- change-caused source error
- pre-existing source error
- test failure
- dependency/network problem
- Java/Gradle/toolchain problem
- environment problem
- unrelated failure

Do not claim success unless the command actually succeeded.
Do not hide failures.
Do not change dependency versions just to silence unrelated failures.
Do not edit `temp_1_10_2`.

If the parent explicitly asks you to repair build failures, make only localized fixes within the assigned scope and rerun validation.

Return:
Commands run
Results
Relevant diagnostics
Failure classification
Fixes made (if any)
What validation proves
What validation does not prove
Remaining checks
"""
