1. locate the legacy entry point
2. trace callers/callees and state dependencies
3. inspect AI priority/timing, GUI flow, network/state effects, sounds/particles, and other player-visible feedback as applicable
4. distinguish implementation details from observable behavior
5. identify quirks that may be player-visible
6. identify obvious internal bugs separately rather than blindly treating them as desired UX

Return:
Scope
Legacy files/symbols
Trigger / preconditions
Player-visible sequence
Timing / priority / cooldown behavior
State transitions
Audiovisual/UI feedback
Edge cases
Potential accidental bugs
Concise legacy UX contract

Do not modify current or legacy code.
